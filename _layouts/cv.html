<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e5e5e5;
      --muted: #8a8a8a;
      --accent: #ededed;
      --line: #262626;
      --code-bg: #171717;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 820px; margin: 0 auto; padding: 56px 24px 80px; }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; color: #fff; }
    h1::before { content: ""; color: var(--muted); }
    h2 {
      font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin: 44px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
    }
    h2::before { content: "## "; }
    h3 { font-size: 15px; font-weight: 700; color: #fff; margin: 26px 0 2px; }
    p { margin: 0 0 10px; }
    strong { color: #fff; font-weight: 700; }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #555; }
    a:hover { text-decoration-color: #fff; }
    code {
      font-family: inherit; font-size: 12px; color: var(--muted);
      background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
    }
    hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0 0; }
    ul { margin: 8px 0 0; padding-left: 0; list-style: none; }
    li { position: relative; padding-left: 20px; margin: 4px 0; }
    li::before { content: "›"; position: absolute; left: 4px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin: 6px 0; display: block; overflow-x: auto; }
    th, td { text-align: left; vertical-align: top; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); }
    th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    thead:empty, thead tr:only-child th:empty { display: none; }
    td:first-child { color: #fff; width: 32%; }
    ::selection { background: #fff; color: #0a0a0a; }
    @media (max-width: 600px) {
      main { padding: 32px 16px 56px; }
      h1 { font-size: 24px; }
      td:first-child { white-space: normal; }
    }
    @media print {
      :root { --bg: #fff; --fg: #111; --muted: #555; --accent: #111; --line: #ddd; --code-bg: #f5f5f5; }
      h1, h3, strong, td:first-child { color: #000; }
      main { padding: 0; }
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
